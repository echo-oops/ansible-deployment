[defaults]
inventory = inventory/staging.yml
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
forks = 20
remote_user = deploy
deprecation_warnings = False
stdout_callback = default

# Path for callback plugins (optional)
# callback_plugins = ./callback_plugins

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
control_path = ~/.ansible/cp/ansible-%%h-%%p-%%r
