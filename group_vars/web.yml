# Переменные для группы web
# Эти значения применяются к хостам в группе web

nginx:
  install: true
  service_name: nginx
  listen_port: 80
  listen_ssl_port: 443
  worker_processes: auto
  client_max_body_size: 16m

# Сайты/виртуальные хосты — пример структуры
nginx_sites:
  - name: myapp
    server_name: "{{ inventory_hostname }}"
    listen: "{{ nginx.listen_port }}"
    root: "{{ app_base_path }}/{{ application.name }}/current/public"
    proxy_pass: "http://127.0.0.1:{{ application.port }}"
    ssl: false

# SSL: если используешь, хранить сертификаты в зашифрованных файлах или использовать Let's Encrypt
use_letsencrypt: false

# Firewall: какие порты открыть для web
allowed_ports:
  - "{{ nginx.listen_port }}"
  - "{{ nginx.listen_ssl_port }}"
  - 22
