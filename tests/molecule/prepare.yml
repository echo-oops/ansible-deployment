---
# Optional prepare playbook executed by Molecule before converge.
# Используется для установки системных зависимостей внутри контейнера,
# если образ не содержит необходимых пакетов.
- name: Prepare instance
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install git and python3-venv (Debian)
      ansible.builtin.package:
        name:
          - git
          - python3-venv
          - python3-pip
        state: present
      when: ansible_facts['os_family'] == 'Debian'
