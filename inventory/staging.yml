# Inventory в формате YAML для staging окружения
# Используется для тестирования перед production.
# Можно запускать playbooks с -i inventory/staging.yml

all:
  vars:
    ansible_user: deploy
    ansible_become: true
    env: staging

  children:
    web:
      hosts:
        staging-web1.local:
          ansible_host: 10.0.10.10

    app:
      hosts:
        staging-app1.local:
          ansible_host: 10.0.10.20

    db:
      hosts:
        staging-db1.local:
          ansible_host: 10.0.10.30
          ansible_user: dbadmin
